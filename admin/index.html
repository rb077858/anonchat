<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>כניסת מנהל · צ'אט אנונימי</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%2308090b%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%225%22 fill=%22%23f5a623%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- bump ?v=N together with the main index.html when style.css changes -->
<link rel="stylesheet" href="../style.css?v=14">
</head>
<body>

<div class="static-overlay" aria-hidden="true"></div>

<main class="screen active admin-login-screen">
  <header class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">צ'אט אנונימי</span>
  </header>

  <section class="admin-login-card">
    <div class="admin-login-icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8 3.7-3.8"/></svg>
    </div>
    <h1 class="admin-login-title">כניסת מנהל</h1>
    <p class="admin-login-sub">דרך חשבון reem.bi</p>

    <p id="admin-login-checking" class="status-line">בודק חיבור…</p>

    <!-- signed out of reem.bi -->
    <div id="panel-signed-out" class="admin-login-panel" hidden>
      <button id="btn-sso-login" type="button" class="btn btn-primary btn-lg">התחברות</button>
    </div>

    <!-- signed in to reem.bi, but not with the admin account -->
    <div id="panel-account" class="admin-login-panel" hidden>
      <div class="sso-user">
        <img id="sso-avatar" class="sso-avatar" alt="" hidden>
        <span id="sso-initial" class="sso-avatar sso-initial" aria-hidden="true"></span>
        <span class="sso-user-text">
          <span id="sso-name" class="sso-name"></span>
          <span id="sso-email" class="sso-email" dir="ltr"></span>
        </span>
      </div>
      <div class="sso-actions">
        <a id="sso-account-link" class="btn btn-secondary" href="#" target="_blank" rel="noopener">החשבון שלי</a>
        <button id="btn-sso-logout" type="button" class="btn btn-ghost">התנתקות</button>
      </div>
    </div>

    <p id="admin-login-status" class="status-line" role="status"></p>
  </section>

  <a class="admin-login-back" href="../">חזרה לאתר</a>
</main>

<script src="https://login.reembir.com/sdk.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../firebase-config.js?v=11"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
